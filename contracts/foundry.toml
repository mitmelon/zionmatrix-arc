[profile.default]
src = "src"
out = "out"
test = "test"

libs = [
    "./node_modules",
    "lib"
]

solc = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

remappings = [
    "@openzeppelin/contracts/=./node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 1000